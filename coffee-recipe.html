<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>コーヒーレシピ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap');

  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --card-shadow: rgba(0, 0, 0, 0.08);
    --brown-dark: #1a1a1a;
    --brown-mid: #333333;
    --brown-light: #666666;
    --brown-muted: #999999;
    --accent: #1a1a1a;
    --accent-light: #e0e0e0;
    --text: #1a1a1a;
    --text-sub: #666666;
    --border: #e0e0e0;
    --red: #1a1a1a;
    --red-light: #f0f0f0;
  }

  * {
    margin: 0; padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* ========= HEADER ========= */
  .header {
    background: #1a1a1a;
    padding: 24px 20px 16px;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 40px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
  }
  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    position: relative;
  }
  .header p {
    color: #888888;
    font-size: 13px;
    margin-top: 4px;
    font-weight: 300;
    position: relative;
  }

  /* ========= ADD BUTTON ========= */
  .add-btn {
    position: fixed;
    bottom: 28px; right: 24px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #1a1a1a;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .add-btn:active { transform: scale(0.92); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

  /* ========= LIST VIEW ========= */
  .list-view { padding: 20px; }
  .list-view-body { margin-top: 12px; }
  .list-view-body {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .recipe-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px var(--card-shadow);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 120px;
  }
  .recipe-card:active { transform: scale(0.975); box-shadow: 0 1px 4px var(--card-shadow); }
  .recipe-card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .recipe-card h3 {
    font-size: 14px; font-weight: 600; color: var(--brown-dark);
    line-height: 1.3;
  }
  .recipe-card-arrow {
    color: var(--brown-muted); font-size: 16px; margin-top: 0;
  }
  .recipe-card-tags {
    display: flex; gap: 6px; margin-top: auto; padding-top: 10px; flex-wrap: wrap;
  }
  .tag {
    font-size: 10px; font-weight: 500;
    background: var(--bg);
    color: var(--brown-mid);
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
    grid-column: 1 / -1;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ========= DETAIL VIEW ========= */
  .detail-view, .edit-view { display: none; }
  .detail-view.active, .edit-view.active { display: block; }
  .list-view.active { display: block; }

  .detail-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 0;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--accent); font-size: 15px; font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }

  .detail-header {
    padding: 8px 20px 16px;
  }
  .detail-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 700;
    color: var(--brown-dark);
  }
  .detail-actions {
    display: flex; gap: 8px;
  }
  .btn-outline {
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff; color: var(--brown-muted);
    font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s;
  }
  .btn-outline:active { background: var(--bg); }
  .btn-outline.danger { border-color: var(--red); color: var(--red); }
  .btn-outline.danger:active { background: var(--red-light); }

  /* Detail sections */
  .detail-section {
    margin: 0 20px 16px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .detail-section-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--brown-light);
    padding: 12px 16px 0;
  }
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row-label { font-size: 14px; color: var(--text-sub); font-weight: 400; }
  .detail-row-value { font-size: 15px; color: var(--brown-dark); font-weight: 600; }

  /* Pouring timeline */
  .timeline {
    margin: 0 20px 16px;
  }
  .timeline-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--brown-light);
    margin-bottom: 10px;
  }
  .timeline-item {
    display: flex; align-items: flex-start; gap: 14px;
    position: relative;
  }
  .timeline-line {
    position: absolute; left: 11px; top: 28px; bottom: 0;
    width: 2px; background: var(--border);
  }
  .timeline-item:last-child .timeline-line { display: none; }
  .timeline-dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #1a1a1a; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0; position: relative; z-index: 1;
  }
  .timeline-content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    flex: 1; margin-bottom: 10px;
  }
  .timeline-time { font-size: 13px; font-weight: 600; color: var(--brown-dark); }
  .timeline-amount { font-size: 14px; color: #333333; font-weight: 600; margin-top: 2px; }

  .detail-remark {
    margin: 0 20px 24px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 14px 16px;
  }
  .detail-remark-label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--brown-light); margin-bottom: 6px;
  }
  .detail-remark p { font-size: 14px; color: var(--text); line-height: 1.5; }

  /* ========= EDIT VIEW ========= */
  .edit-header {
    padding: 12px 20px 20px;
  }
  .edit-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 700; color: var(--brown-dark);
  }

  .form-group { margin: 0 20px 14px; }
  .form-label {
    font-size: 12px; font-weight: 600; color: var(--brown-light);
    margin-bottom: 6px; display: block;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px; color: var(--brown-dark);
    background: var(--card);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--brown-muted); }

  .form-row {
    display: flex; gap: 10px;
  }
  .form-row .form-group { flex: 1; margin: 0; }

  .pouring-section {
    margin: 20px 20px 0;
  }
  .pouring-section-title {
    font-size: 12px; font-weight: 600; color: var(--brown-light);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .pouring-item {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .pouring-badge {
    font-size: 11px; font-weight: 700;
    background: var(--brown-dark); color: #fff;
    padding: 4px 8px; border-radius: 6px;
    min-width: 42px; text-align: center;
    flex-shrink: 0;
  }
  .pouring-item .form-input {
    padding: 10px 12px; font-size: 14px;
  }

  .form-actions {
    display: flex; gap: 10px;
    padding: 24px 20px 40px;
  }
  .btn-save {
    flex: 2;
    padding: 13px; border-radius: 10px;
    border: none; background: #1a1a1a; color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s;
  }
  .btn-save:active { background: #333333; }
  .btn-cancel {
    flex: 1;
    padding: 13px; border-radius: 10px;
    border: 1.5px solid var(--border); background: #fff; color: var(--brown-mid);
    font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .btn-cancel:active { background: var(--bg); }

  /* ========= MODAL ========= */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff; border-radius: 18px 18px 0 0;
    width: 100%; max-width: 480px;
    padding: 20px 24px 40px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 0 auto 18px;
  }
  .modal h3 { font-size: 17px; font-weight: 600; color: var(--brown-dark); margin-bottom: 6px; }
  .modal p { font-size: 14px; color: var(--text-sub); margin-bottom: 18px; line-height: 1.5; }
  .modal-btn-delete {
    width: 100%; padding: 13px; border-radius: 10px;
    border: none; background: #1a1a1a; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    margin-bottom: 8px;
  }
  .modal-btn-cancel {
    width: 100%; padding: 13px; border-radius: 10px;
    border: 1.5px solid var(--border); background: #fff; color: var(--brown-mid);
    font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
  }

  /* Scroll padding for FAB */
  .scroll-pad { height: 80px; }

  /* Data management */
  .data-actions {
    display: flex;
    gap: 10px;
    padding: 20px;
    padding-top: 10px;
  }
  .data-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--brown-mid);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .data-btn:active { background: var(--bg); }
  #importFile { display: none; }

  /* Timer */
  .timer-section {
    margin: 0 20px 16px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 16px;
  }
  .timer-display {
    text-align: center;
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    font-size: 56px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .timer-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .timer-btn {
    padding: 10px 24px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--brown-mid);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .timer-btn.primary {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
  }
  .timer-btn:active { opacity: 0.8; }
  .timer-current-step {
    background: #1a1a1a;
    color: #fff;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-bottom: 10px;
  }
  .timer-current-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .timer-current-action {
    font-size: 18px;
    font-weight: 600;
  }
  .timer-next-step {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .timer-next-label {
    font-size: 11px;
    color: var(--brown-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .timer-next-action {
    font-size: 14px;
    color: var(--brown-mid);
    font-weight: 500;
  }
  .timer-flash {
    animation: flash 0.5s ease-in-out 3;
  }
  @keyframes flash {
    0%, 100% { background: #1a1a1a; }
    50% { background: #444; }
  }
</style>
</head>
<body>

<!-- ===== LIST VIEW ===== -->
<div class="list-view active" id="listView">
  <div class="header">
    <h1>☕ コーヒーレシピ</h1>
    <p>お気に入りのレシピを保存しましょう</p>
  </div>
  <div id="recipeList" class="list-view-body"></div>
  <div class="data-actions">
    <button class="data-btn" onclick="exportRecipes()">エクスポート</button>
    <button class="data-btn" onclick="document.getElementById('importFile').click()">インポート</button>
    <input type="file" id="importFile" accept=".json" onchange="importRecipes(event)">
  </div>
  <div class="scroll-pad"></div>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div class="detail-view" id="detailView">
  <div class="detail-top-bar">
    <button class="back-btn" onclick="showList()">← レシピ一覧</button>
    <div class="detail-actions">
      <button class="btn-outline" onclick="showEdit(currentRecipe)">編集</button>
      <button class="btn-outline danger" onclick="confirmDelete()">削除</button>
    </div>
  </div>
  <div class="detail-header">
    <h2 id="detailName"></h2>
  </div>
  <div id="detailBody"></div>
  <div class="timer-section" id="timerSection" style="display:none;">
    <div class="timer-display" id="timerDisplay">0:00</div>
    <div class="timer-controls">
      <button class="timer-btn primary" id="timerStartBtn" onclick="toggleTimer()">スタート</button>
      <button class="timer-btn" onclick="resetTimer()">リセット</button>
    </div>
    <div class="timer-current-step" id="timerCurrentStep">
      <div class="timer-current-label">現在</div>
      <div class="timer-current-action" id="timerCurrentAction">スタートを押してください</div>
    </div>
    <div class="timer-next-step" id="timerNextStep">
      <div class="timer-next-label">次のステップ</div>
      <div class="timer-next-action" id="timerNextAction">-</div>
    </div>
  </div>
  <div class="scroll-pad"></div>
</div>

<!-- ===== EDIT VIEW ===== -->
<div class="edit-view" id="editView">
  <button class="back-btn" onclick="showList()">← レシピ一覧</button>
  <div class="edit-header">
    <h2 id="editTitle">新しいレシピ</h2>
  </div>

  <div class="form-group">
    <label class="form-label">レシピ名</label>
    <input class="form-input" id="inputName" type="text" placeholder="例：オーバーポア">
  </div>

  <div class="form-group">
    <label class="form-label">豆の量 (g)</label>
    <input class="form-input" id="inputBean" type="number" placeholder="15">
  </div>

  <div class="form-group">
    <label class="form-label">挽き目</label>
    <input class="form-input" id="inputGrind" type="text" placeholder="例：中細挽き">
  </div>

  <div class="form-group">
    <label class="form-label">湯量 (ml)</label>
    <input class="form-input" id="inputWater" type="number" placeholder="250">
  </div>

  <div class="form-group">
    <label class="form-label">温度 (℃)</label>
    <input class="form-input" id="inputTemp" type="number" placeholder="92">
  </div>

  <div class="form-group">
    <label class="form-label">その他</label>
    <input class="form-input" id="inputPrep" type="text" placeholder="例：ペーパーフィルターをリンス済み">
  </div>

  <div class="pouring-section">
    <div class="pouring-section-title">お湯の投入スケジュール</div>

    <!-- 0秒 -->
    <div class="pouring-item">
      <div class="pouring-badge">0秒</div>
      <input class="form-input" id="pour0_amount" type="number" placeholder="お湯(ml)">
    </div>

    <!-- 1〜4段階 (秒数＋量) -->
    <div class="pouring-item">
      <input class="form-input" id="pour1_time" type="number" value="30" style="width:64px;flex:none;">
      <span style="color:var(--brown-muted);font-size:13px;flex-shrink:0;">秒後</span>
      <input class="form-input" id="pour1_amount" type="number" placeholder="お湯(ml)">
    </div>
    <div class="pouring-item">
      <input class="form-input" id="pour2_time" type="number" value="60" style="width:64px;flex:none;">
      <span style="color:var(--brown-muted);font-size:13px;flex-shrink:0;">秒後</span>
      <input class="form-input" id="pour2_amount" type="number" placeholder="お湯(ml)">
    </div>
    <div class="pouring-item">
      <input class="form-input" id="pour3_time" type="number" value="90" style="width:64px;flex:none;">
      <span style="color:var(--brown-muted);font-size:13px;flex-shrink:0;">秒後</span>
      <input class="form-input" id="pour3_amount" type="number" placeholder="お湯(ml)">
    </div>
    <div class="pouring-item">
      <input class="form-input" id="pour4_time" type="number" placeholder="秒" style="width:64px;flex:none;">
      <span style="color:var(--brown-muted);font-size:13px;flex-shrink:0;">秒後</span>
      <input class="form-input" id="pour4_amount" type="number" placeholder="お湯(ml)">
    </div>
  </div>

  <div class="form-group" style="margin-top:20px;">
    <label class="form-label">備考</label>
    <input class="form-input" id="inputRemark" type="text" placeholder="例：湯温92度、2回目は円周状に">
  </div>

  <div class="form-actions">
    <button class="btn-save" onclick="saveRecipe()">保存</button>
    <button class="btn-cancel" onclick="showList()">キャンセル</button>
  </div>
</div>

<!-- ===== DELETE MODAL ===== -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>レシピを削除しますか？</h3>
    <p>「<span id="deleteTargetName"></span>」のレシピが削除されます。この操作は戻せません。</p>
    <button class="modal-btn-delete" onclick="executeDelete()">削除する</button>
    <button class="modal-btn-cancel" onclick="closeDeleteModal()">キャンセル</button>
  </div>
</div>

<!-- FAB -->
<button class="add-btn" id="fabBtn" onclick="showEdit(null)">＋</button>

<script>
// ========= データ管理 =========
const STORAGE_KEY = 'coffee_recipes';
let recipes = [];
let currentRecipe = null;
let isEditing = false; // 編集中のレシピがある場合のID

// サンプルデータ（初回用）
const defaultRecipes = [
  {
    id: 1,
    name: "オーバーポア",
    bean: 15,
    grind: "中細挽き",
    water: 250,
    temp: 92,
    prep: "ペーパーフィルターをリンス済み",
    pours: [
      { time: 0, amount: 50 },
      { time: 30, amount: 100 },
      { time: 60, amount: 100 },
    ],
    remark: "2回目は円周状に注ぐ"
  },
  {
    id: 2,
    name: "エタオル式ポアオーバー",
    bean: 12,
    grind: "中粗挽き",
    water: 200,
    temp: 95,
    prep: "コーヒーグラインダーで中粗挽き",
    pours: [
      { time: 0, amount: 40 },
      { time: 45, amount: 80 },
      { time: 75, amount: 80 },
    ],
    remark: "湯温は高めにする"
  }
];

// localStorageからレシピを読み込み
function loadRecipes() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    console.log('localStorage読み込み:', saved ? 'データあり' : 'データなし');
    if (saved) {
      recipes = JSON.parse(saved);
      console.log('読み込んだレシピ数:', recipes.length);
    } else {
      recipes = defaultRecipes.slice();
      saveToStorage();
      console.log('デフォルトレシピを保存しました');
    }
  } catch (e) {
    console.error('localStorage エラー:', e);
    alert('このブラウザではデータの保存ができません。\nローカルファイルではなくWebサーバー経由でアクセスしてください。');
    recipes = defaultRecipes.slice();
  }
}

// localStorageにレシピを保存
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
    console.log('保存完了:', recipes.length, '件');
  } catch (e) {
    console.error('保存エラー:', e);
    alert('データの保存に失敗しました。');
  }
}

function nextId() {
  return recipes.length > 0 ? Math.max(...recipes.map(r => r.id)) + 1 : 1;
}

// ========= タイマー =========
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let timerPours = [];
let lastStepIndex = -1;

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function initTimer(pours) {
  timerPours = pours.filter(p => p.amount);
  timerSeconds = 0;
  timerRunning = false;
  lastStepIndex = -1;
  document.getElementById('timerDisplay').textContent = '0:00';
  document.getElementById('timerStartBtn').textContent = 'スタート';
  updateTimerSteps();

  // タイマーセクションを表示（投入スケジュールがある場合のみ）
  document.getElementById('timerSection').style.display = timerPours.length > 0 ? 'block' : 'none';
}

function toggleTimer() {
  if (timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  timerRunning = true;
  document.getElementById('timerStartBtn').textContent = 'ストップ';
  timerInterval = setInterval(function() {
    timerSeconds++;
    document.getElementById('timerDisplay').textContent = formatTime(timerSeconds);
    updateTimerSteps();
  }, 1000);
}

function stopTimer() {
  timerRunning = false;
  document.getElementById('timerStartBtn').textContent = 'スタート';
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function resetTimer() {
  stopTimer();
  timerSeconds = 0;
  lastStepIndex = -1;
  document.getElementById('timerDisplay').textContent = '0:00';
  updateTimerSteps();
}

function updateTimerSteps() {
  const currentEl = document.getElementById('timerCurrentAction');
  const nextEl = document.getElementById('timerNextAction');
  const currentStepEl = document.getElementById('timerCurrentStep');

  if (timerPours.length === 0) {
    currentEl.textContent = '投入スケジュールがありません';
    nextEl.textContent = '-';
    return;
  }

  // 現在のステップを見つける
  let currentIndex = -1;
  for (let i = timerPours.length - 1; i >= 0; i--) {
    if (timerSeconds >= timerPours[i].time) {
      currentIndex = i;
      break;
    }
  }

  // ステップが変わったらフラッシュ
  if (currentIndex !== lastStepIndex && currentIndex >= 0) {
    currentStepEl.classList.remove('timer-flash');
    void currentStepEl.offsetWidth; // reflow
    currentStepEl.classList.add('timer-flash');
    lastStepIndex = currentIndex;
  }

  // 現在のステップ表示
  if (currentIndex < 0) {
    const firstPour = timerPours[0];
    const remaining = firstPour.time - timerSeconds;
    currentEl.textContent = '準備中... あと ' + remaining + '秒';
  } else {
    const pour = timerPours[currentIndex];
    const label = pour.time === 0 ? '今すぐ' : pour.time + '秒';
    currentEl.textContent = label + ' → ' + pour.amount + 'ml 投入';
  }

  // 次のステップ表示
  const nextIndex = currentIndex + 1;
  if (nextIndex < timerPours.length) {
    const nextPour = timerPours[nextIndex];
    const remaining = nextPour.time - timerSeconds;
    nextEl.textContent = remaining + '秒後 → ' + nextPour.amount + 'ml';
  } else {
    nextEl.textContent = '完了';
  }
}

// ========= 画面切り替え =========
function showList() {
  resetTimer();
  document.getElementById('listView').classList.add('active');
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('editView').classList.remove('active');
  document.getElementById('fabBtn').style.display = 'flex';
  renderList();
}

function showDetail(recipe) {
  currentRecipe = recipe;
  document.getElementById('listView').classList.remove('active');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('editView').classList.remove('active');
  document.getElementById('fabBtn').style.display = 'none';
  resetTimer();
  initTimer(recipe.pours || []);
  renderDetail(recipe);
}

function showEdit(recipe) {
  document.getElementById('listView').classList.remove('active');
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('editView').classList.add('active');
  document.getElementById('fabBtn').style.display = 'none';

  if (recipe) {
    // 編集モード
    isEditing = recipe.id;
    document.getElementById('editTitle').textContent = 'レシピを編集';
    document.getElementById('inputName').value = recipe.name || '';
    document.getElementById('inputBean').value = recipe.bean || '';
    document.getElementById('inputGrind').value = recipe.grind || '';
    document.getElementById('inputWater').value = recipe.water || '';
    document.getElementById('inputTemp').value = recipe.temp || '';
    document.getElementById('inputPrep').value = recipe.prep || '';
    document.getElementById('inputRemark').value = recipe.remark || '';

    // pours: index0=0秒, index1〜4=1〜4段階
    const pours = recipe.pours || [];
    document.getElementById('pour0_amount').value = (pours[0] && pours[0].amount) || '';
    for (let i = 1; i <= 4; i++) {
      const p = pours[i];
      document.getElementById('pour' + i + '_time').value = (p && p.time) || '';
      document.getElementById('pour' + i + '_amount').value = (p && p.amount) || '';
    }
  } else {
    // 新規モード
    isEditing = null;
    document.getElementById('editTitle').textContent = '新しいレシピ';
    document.getElementById('inputName').value = '';
    document.getElementById('inputBean').value = '';
    document.getElementById('inputGrind').value = '';
    document.getElementById('inputWater').value = '';
    document.getElementById('inputTemp').value = '';
    document.getElementById('inputPrep').value = '';
    document.getElementById('inputRemark').value = '';
    document.getElementById('pour0_amount').value = '';
    // デフォルト値: 30秒、60秒、90秒、空欄
    document.getElementById('pour1_time').value = '30';
    document.getElementById('pour1_amount').value = '';
    document.getElementById('pour2_time').value = '60';
    document.getElementById('pour2_amount').value = '';
    document.getElementById('pour3_time').value = '90';
    document.getElementById('pour3_amount').value = '';
    document.getElementById('pour4_time').value = '';
    document.getElementById('pour4_amount').value = '';
  }
}

// ========= リスト描画 =========
function renderList() {
  const container = document.getElementById('recipeList');
  if (recipes.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">☕</div>
        <p>まだレシピがありません。<br>右下の＋ボタンから<br>最初のレシピを追加してみてください。</p>
      </div>`;
    return;
  }
  container.innerHTML = recipes.map(r => {
    const tags = [];
    if (r.bean) tags.push('豆 ' + r.bean + 'g');
    if (r.water) tags.push('湯 ' + r.water + 'ml');
    if (r.temp) tags.push(r.temp + '℃');
    return `
      <div class="recipe-card" onclick="showDetail(getRecipe(${r.id}))">
        <div class="recipe-card-header">
          <h3>${escapeHtml(r.name || '名前なし')}</h3>
          <span class="recipe-card-arrow">›</span>
        </div>
        <div class="recipe-card-tags">${tags.map(t => '<span class="tag">' + t + '</span>').join('')}</div>
      </div>`;
  }).join('');
}

// ========= 詳細描画 =========
function renderDetail(recipe) {
  document.getElementById('detailName').textContent = recipe.name || '名前なし';

  let html = '';

  // 基本情報
  html += '<div class="detail-section">';
  html += '<div class="detail-section-title">基本情報</div>';
  if (recipe.bean) html += detailRow('豆の量', recipe.bean + ' g');
  if (recipe.grind) html += detailRow('挽き目', recipe.grind);
  if (recipe.water) html += detailRow('湯量', recipe.water + ' ml');
  if (recipe.temp) html += detailRow('温度', recipe.temp + ' ℃');
  html += '</div>';

  // その他準備
  if (recipe.prep) {
    html += '<div class="detail-section">';
    html += '<div class="detail-section-title">その他準備</div>';
    html += '<div style="padding:10px 16px;font-size:14px;color:var(--text);">' + escapeHtml(recipe.prep) + '</div>';
    html += '</div>';
  }

  // タイムラインの投入スケジュール（空の段階は非表示）
  const pours = (recipe.pours || []).filter(p => p.amount);
  if (pours.length > 0) {
    html += '<div class="timeline">';
    html += '<div class="timeline-title">お湯の投入スケジュール</div>';
    pours.forEach((p, i) => {
      const isLast = (i === pours.length - 1);
      const label = p.time === 0 ? '開始時点' : p.time + '秒後';
      html += `
        <div class="timeline-item">
          ${isLast ? '' : '<div class="timeline-line"></div>'}
          <div class="timeline-dot">${i + 1}</div>
          <div class="timeline-content">
            <div class="timeline-time">${label}</div>
            <div class="timeline-amount">${p.amount} ml</div>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  // 備考
  if (recipe.remark) {
    html += `<div class="detail-remark">
      <div class="detail-remark-label">備考</div>
      <p>${escapeHtml(recipe.remark)}</p>
    </div>`;
  }

  document.getElementById('detailBody').innerHTML = html;
}

function detailRow(label, value) {
  return `<div class="detail-row">
    <span class="detail-row-label">${label}</span>
    <span class="detail-row-value">${escapeHtml(value)}</span>
  </div>`;
}

// ========= 保存 =========
function saveRecipe() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) {
    alert('レシピ名を入力してください。');
    return;
  }

  const pours = [];
  // 0秒
  const a0 = document.getElementById('pour0_amount').value;
  if (a0) pours.push({ time: 0, amount: Number(a0) });
  // 1〜4段階
  for (let i = 1; i <= 4; i++) {
    const t = document.getElementById('pour' + i + '_time').value;
    const a = document.getElementById('pour' + i + '_amount').value;
    if (t && a) pours.push({ time: Number(t), amount: Number(a) });
  }
  // 秒数順にソート
  pours.sort((a, b) => a.time - b.time);

  const recipe = {
    name: name,
    bean: document.getElementById('inputBean').value ? Number(document.getElementById('inputBean').value) : null,
    grind: document.getElementById('inputGrind').value.trim() || null,
    water: document.getElementById('inputWater').value ? Number(document.getElementById('inputWater').value) : null,
    temp: document.getElementById('inputTemp').value ? Number(document.getElementById('inputTemp').value) : null,
    prep: document.getElementById('inputPrep').value.trim() || null,
    pours: pours,
    remark: document.getElementById('inputRemark').value.trim() || null
  };

  if (isEditing !== null) {
    // 編集
    const idx = recipes.findIndex(r => r.id === isEditing);
    if (idx !== -1) {
      recipe.id = isEditing;
      recipes[idx] = recipe;
    }
  } else {
    // 新規
    recipe.id = nextId();
    recipes.push(recipe);
  }

  saveToStorage();
  showDetail(recipe);
}

// ========= 削除 =========
function confirmDelete() {
  document.getElementById('deleteTargetName').textContent = currentRecipe.name || '名前なし';
  document.getElementById('deleteModal').classList.add('active');
}
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('active');
}
function executeDelete() {
  recipes = recipes.filter(r => r.id !== currentRecipe.id);
  saveToStorage();
  closeDeleteModal();
  showList();
}

// ========= エクスポート/インポート =========
function exportRecipes() {
  if (recipes.length === 0) {
    alert('エクスポートするレシピがありません。');
    return;
  }
  const data = JSON.stringify(recipes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'coffee-recipes.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importRecipes(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) {
        throw new Error('Invalid format');
      }
      // IDを振り直して追加
      let maxId = recipes.length > 0 ? Math.max(...recipes.map(r => r.id)) : 0;
      imported.forEach(r => {
        maxId++;
        r.id = maxId;
        recipes.push(r);
      });
      saveToStorage();
      renderList();
      alert(imported.length + '件のレシピをインポートしました。');
    } catch (err) {
      alert('ファイルの読み込みに失敗しました。\n正しいJSONファイルか確認してください。');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========= ユーティリティ =========
function getRecipe(id) { return recipes.find(r => r.id === id); }
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 初期化
loadRecipes();
renderList();
</script>
